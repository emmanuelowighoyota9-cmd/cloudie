# cloudieexpress.duckdns.org — serves the Vite build output (dist/) as an SPA.
#
# Installed by deploy/bootstrap.sh to /etc/nginx/sites-available/<domain>.
# `__DOMAIN__` is replaced with the real hostname by the bootstrap script.
#
# Why each block matters:
#   * the BrowserRouter in src/main.tsx owns every path, so unknown paths MUST
#     return index.html instead of 404 (try_files fallback below);
#   * /assets/* is content-hashed by Vite, so it can be cached immutably forever;
#   * index.html and sw.js must never be cached, otherwise a new deploy keeps
#     serving the old bundle (and the old service worker) to returning visitors.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME HTTP-01 webroot. Kept after issuance so renewals keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Plain `ssl` on purpose: the `http2` parameter of `listen` is deprecated in
    # current nginx releases, so naming it here would emit a warning on new
    # installs and fail on very old ones. To opt into HTTP/2 (nginx >= 1.25.1)
    # add `http2 on;` as the first line of this block.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    root /var/www/cloudieexpress/current;
    index index.html;

    # Vite emits /assets/<name>-<hash>.js|css. Immutable by construction.
    location /assets/ {
        include /etc/nginx/snippets/cloudieexpress-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        # A missing asset is a real 404 — never fall back to HTML, or the browser
        # reports "Unexpected token '<'" instead of a missing chunk.
        try_files $uri =404;
    }

    # The app shell. `try_files` internally redirects to /index.html, which
    # re-matches the exact block below and therefore is served no-store.
    location / {
        include /etc/nginx/snippets/cloudieexpress-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/cloudieexpress-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Service worker (public/sw.js): must revalidate on every load so a new
    # deploy can take over the cache. The header is set explicitly rather than
    # via `expires -1`, which would emit a second Cache-Control header.
    location = /sw.js {
        include /etc/nginx/snippets/cloudieexpress-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/cloudieexpress-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Compression for the text payloads Vite produces.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;
}
