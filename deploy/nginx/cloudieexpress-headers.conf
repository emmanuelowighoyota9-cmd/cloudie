# Shared response headers for cloudieexpress.duckdns.org.
#
# Installed by deploy/bootstrap.sh to /etc/nginx/snippets/cloudieexpress-headers.conf.
#
# This is an `include`d snippet rather than a server-level block on purpose:
# nginx discards inherited `add_header` directives as soon as a child location
# declares its own, so each location that needs Cache-Control must re-include
# these. Keeping them in one file avoids the headers silently disappearing.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
