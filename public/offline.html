<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Cloudie · Offline</title>
    <style>
      /* Mirrors the app's design tokens (see src/index.css) so going offline
         does not drop the customer into a different-looking product. */
      :root {
        color-scheme: dark;
        --bg: #000000;
        --fg: #ffffff;
        --muted: #a1a1aa;
        --card: #111111;
        --border: #27272a;
        --primary: #10b981;
        --primary-ink: #04120c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: var(--primary);
        display: grid;
        place-items: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
      .actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; }
      a, button {
        font: inherit;
        cursor: pointer;
        border-radius: 10px;
        padding: 10px 18px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        text-decoration: none;
      }
      a.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-ink);
        font-weight: 600;
      }
      a.primary:hover {
        background: #059669;
        border-color: #059669;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 512 512" fill="none">
          <path
            d="M360 296H168a48 48 0 0 1-6-95.6 76 76 0 0 1 145-18.4A58 58 0 0 1 360 296Z"
            fill="#04120c"
          />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Cloudie couldn't reach the network. Nothing you entered has been
        lost — reconnect and the workspace syncs automatically.
      </p>
      <div class="actions">
        <button onclick="location.reload()">Try again</button>
        <a class="primary" href="/tracking">Track a shipment</a>
      </div>
    </main>
  </body>
</html>
