name: Build Cloudie for InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository currently has no root package-lock.json, so npm ci and
      # setup-node's root npm cache cannot work until a root lockfile is committed.
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production frontend
        env:
          VITE_NEON_API_URL: ${{ vars.VITE_NEON_API_URL || 'https://cloudie-operations-api-stage.onrender.com' }}
        run: npm run build

      - name: Prepare and verify static output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html

          # Keep the host's SPA fallback files in the final deployable output.
          if [ ! -f dist/404.html ]; then
            cat > dist/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cloudie</title></head>
          <body><p>Page not found. <a href="/">Return to Cloudie</a></p></body>
          </html>
          HTML
          fi

          # Missing JS/CSS/assets must return 404, not the SPA HTML shell.
          # Returning index.html for a missing module triggers browser errors such
          # as "'text/html' is not a valid JavaScript MIME type".
          cat > dist/.htaccess <<'HTACCESS'
          Options -Indexes
          DirectoryIndex index.html
          RewriteEngine On

          # Never rewrite missing static assets to index.html.
          RewriteCond %{REQUEST_URI} ^/assets/ [OR]
          RewriteCond %{REQUEST_URI} \.(?:js|mjs|css|map|json|wasm|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ [NC]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteRule ^ - [R=404,L]

          # Client-side routes fall back to the SPA shell only when no file exists.
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          HTACCESS

          test -s dist/index.html
          test -s dist/404.html
          test -s dist/.htaccess
          # Every JS/CSS URL emitted by the built HTML must exist in the artifact.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map((m) => m[1]);
          if (!refs.length) throw new Error('Built index.html contains no /assets references; refusing to package source HTML.');
          for (const ref of refs) {
            const file = 'dist' + decodeURIComponent(ref.split('?')[0]);
            if (!fs.existsSync(file) || !fs.statSync(file).isFile()) {
              throw new Error('Built asset referenced by index.html is missing: ' + ref);
            }
          }
          console.log('Verified ' + refs.length + ' built asset references.');
          NODE
          echo "Verified deployable files:"
          find dist -maxdepth 3 -type f -print | sort

      - name: Package site with files at ZIP root
        shell: bash
        run: |
          set -euo pipefail
          rm -f cloudie-infinityfree-site.zip
          (cd dist && zip -qr ../cloudie-infinityfree-site.zip .)
          unzip -l cloudie-infinityfree-site.zip
          unzip -Z1 cloudie-infinityfree-site.zip | grep -qx 'index.html'
          unzip -Z1 cloudie-infinityfree-site.zip | grep -qx '.htaccess'
          unzip -Z1 cloudie-infinityfree-site.zip | grep -qx '404.html'

      - name: Upload deployable site
        uses: actions/upload-artifact@v4
        with:
          name: cloudie-infinityfree-site
          path: cloudie-infinityfree-site.zip
          if-no-files-found: error
          retention-days: 7
