name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Resolve newly added Bun test dependencies in CI; the lockfile must be regenerated with Bun.
      - run: bun install
      - run: bunx tsc -b --noEmit
      - run: bun test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix api ci
      - run: npm --prefix api run typecheck
      - run: npm --prefix api test
